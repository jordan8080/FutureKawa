[pytest]
# Les tests vivent dans tests/. conftest.py (à la racine de backend-country)
# rend le package "app" importable et fournit les fixtures (DB SQLite isolée).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -v : sortie lisible ; --junitxml : rapport consommé par Jenkins (publishTestResults).
addopts = -v --junitxml=reports/junit.xml
